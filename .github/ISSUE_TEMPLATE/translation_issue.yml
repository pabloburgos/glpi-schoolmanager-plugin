name: 🌍 Translation issue
description: Report mixed, missing or incorrect text in any language
title: "[Translation]: "
labels: ["translation", "needs triage"]
body:
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - English (en_GB)
        - Spanish (es_ES)
        - French (fr_FR)
        - German (de_DE)
        - Italian (it_IT)
        - Portuguese (pt_PT)
        - Custom language
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: Page or module
      placeholder: "Example: IT stock, Request details, Configuration, Classroom map"
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Current text
      placeholder: "Text currently shown in the UI"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected text
      placeholder: "Correct translation"
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Add a screenshot if it helps locate the text.
